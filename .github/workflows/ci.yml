name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SlopClean.slnx

      - name: Build Elevated
        run: dotnet build src/SlopClean.Elevated/SlopClean.Elevated.csproj -c Release --no-restore

      - name: Build
        run: dotnet build SlopClean.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SlopClean.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Publish
        run: |
          dotnet publish src/SlopClean.App/SlopClean.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/slopclean-win-x64
          Get-FileHash artifacts/slopclean-win-x64/SlopClean.App.exe -Algorithm SHA256 | Format-List | Out-File artifacts/slopclean-win-x64.sha256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slopclean-win-x64
          path: |
            artifacts/slopclean-win-x64/**
            artifacts/slopclean-win-x64.sha256.txt
