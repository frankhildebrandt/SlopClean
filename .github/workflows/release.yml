name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, publish
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: Release
      publish: true
      upload_test_results: true

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}".TrimStart("v")
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+([-+].+)?$') {
            throw "Invalid version '$ver'. Expected semver like 0.1.0"
          }
          "version=$ver" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "tag=v$ver" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Download publish artifacts
        uses: actions/download-artifact@v4
        with:
          name: slopclean-win-x64
          path: artifacts

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/SlopClean-$ver-win-x64.zip"
          $sha = "artifacts/SlopClean-$ver-win-x64.sha256.txt"

          if (Test-Path "artifacts/slopclean-win-x64.zip") {
            Move-Item -Force "artifacts/slopclean-win-x64.zip" $zip
          } elseif (Test-Path "artifacts/slopclean-win-x64") {
            Compress-Archive -Path "artifacts/slopclean-win-x64\*" -DestinationPath $zip -Force
          } else {
            throw "Published artifacts not found"
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Set-Content -Path $sha -Value "SHA256 $hash  SlopClean-$ver-win-x64.zip"
          "zip=$zip" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "sha=$sha" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Ensure release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if (-not (git rev-parse -q --verify "refs/tags/$tag")) {
            git tag $tag
            git push origin $tag
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "${{ steps.assets.outputs.zip }}"
          $sha = "${{ steps.assets.outputs.sha }}"
          $notesFile = "artifacts/release-notes.md"
          @"
          ## SlopClean $tag

          Self-contained Windows x64 build (unpackaged WinUI 3 / .NET 10).

          ### Assets
          - ``SlopClean-$ver-win-x64.zip``
          - ``SlopClean-$ver-win-x64.sha256.txt``

          ### Verify
          ``````powershell
          Get-FileHash .\SlopClean-$ver-win-x64.zip -Algorithm SHA256
          ``````
          "@ | Set-Content -Path $notesFile

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip $sha --clobber
          } else {
            gh release create $tag $zip $sha --title "SlopClean $tag" --notes-file $notesFile --verify-tag
          }
